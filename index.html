<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Talabia</title>
<meta name="theme-color" content="#0f6b4f">
<meta name="description" content="Orders from Instagram and WhatsApp, in one place.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Talabia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-width column, sticky header, fixed bottom tabs; a seller's order book in the pocket. */
:root{
  --bg:#f3f2ee; --surface:#ffffff; --ink:#1b1d1a; --muted:#64685f; --line:#e2e1da;
  --accent:#0f6b4f; --accent-ink:#ffffff; --accent-soft:#dcefe6;
  --amber:#b7791f; --amber-soft:#fbefd6; --red:#c2412d; --red-soft:#f9e1dc; --blue:#2f5fa8; --blue-soft:#e1e9f6;
  --ig:#b03a7a; --ig-soft:#f6e0ec; --wa:#1d8a4e; --wa-soft:#dbf1e3; --ai:#6b4fd1; --ai-soft:#ebe6fb;
  --display:"Sora",ui-sans-serif,system-ui,sans-serif; --body:"Manrope",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111311; --surface:#1b1e1b; --ink:#eef0ea; --muted:#a2a79b; --line:#2d312c;
  --accent:#4cc79b; --accent-ink:#0d1a14; --accent-soft:#163428;
  --amber:#e8b55a; --amber-soft:#3a2e15; --red:#f0826e; --red-soft:#3d1d17; --blue:#8bb0ee; --blue-soft:#1b2840;
  --ig:#ee8fc0; --ig-soft:#3a1d2d; --wa:#5fd394; --wa-soft:#15331f; --ai:#b4a2ff; --ai-soft:#2a2347; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111311; --surface:#1b1e1b; --ink:#eef0ea; --muted:#a2a79b; --line:#2d312c;
  --accent:#4cc79b; --accent-ink:#0d1a14; --accent-soft:#163428;
  --amber:#e8b55a; --amber-soft:#3a2e15; --red:#f0826e; --red-soft:#3d1d17; --blue:#8bb0ee; --blue-soft:#1b2840;
  --ig:#ee8fc0; --ig-soft:#3a1d2d; --wa:#5fd394; --wa-soft:#15331f; --ai:#b4a2ff; --ai-soft:#2a2347; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:460px;margin:0 auto;min-height:100%}
@media(min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.proto{font-size:12px;color:var(--muted);background:var(--amber-soft);padding-block:7px;display:flex;justify-content:space-between;gap:10px}
.proto button{background:none;border:0;text-decoration:underline;font-size:12px;padding:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--accent)}
.shopbtn{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 5px;font-size:13px;font-weight:600;min-width:0}
.shopbtn .av{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:11px;flex:none}
main{padding-block:16px 96px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:24px;letter-spacing:-.02em}
h2{font-size:16px}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.sub{color:var(--muted);margin:2px 0 0;font-size:13.5px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left}
.kpi strong{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.warn strong{color:var(--red)}
.kpi.big{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);width:100%}
.kpi.big span{color:var(--accent-ink);opacity:.85}
.kpi.big strong{font-size:32px}
.todo{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.todo button{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;text-align:left;gap:10px}
.todo button:first-child{border-top:0}
.count{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;border-radius:8px;padding:2px 9px;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;width:100%}
.order b{font-size:15px}
.order .price{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.order .info{font-size:13px;color:var(--muted);min-width:0}
.pill{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;justify-self:end;white-space:nowrap}
.s-new{background:var(--blue-soft);color:var(--blue)}
.s-confirmed,.s-shipped,.s-low{background:var(--amber-soft);color:var(--amber)}
.s-delivered,.s-paid,.s-ok{background:var(--accent-soft);color:var(--accent)}
.s-refused,.s-out{background:var(--red-soft);color:var(--red)}
.src{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.src.ig{background:var(--ig-soft);color:var(--ig)}
.src.wa{background:var(--wa-soft);color:var(--wa)}
.flag{color:var(--red);font-weight:700;font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 14px;font-weight:700;text-decoration:none;text-align:center;display:block;width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red-soft);color:var(--red)}
.btn.wa{background:var(--wa);color:#fff}
.btn.ig{background:var(--ig);color:#fff}
.btn.ai{background:var(--ai);color:#fff}
.btn.link{background:none;color:var(--accent);padding:6px;width:auto}
.btn.sm{padding:7px 10px;font-size:13px;width:auto}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
input,textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:15px;transition:background .3s,border-color .3s}
input.auto,select.auto,textarea.auto{background:var(--ai-soft);border-color:var(--ai)}
textarea{min-height:80px;resize:vertical}
.warnbox{background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 12px;font-weight:600;font-size:13.5px}
.okbox{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-weight:600;font-size:13.5px}
.aibox{background:var(--ai-soft);color:var(--ai);border-radius:12px;padding:10px 12px;font-weight:600;font-size:13.5px}
.steps{display:flex;gap:4px}
.steps span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--accent)}
.steps span.bad{background:var(--red)}
.msg{background:var(--accent-soft);border-radius:12px 12px 12px 4px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.msg.in{background:var(--bg);border:1px solid var(--line);border-radius:12px 12px 4px 12px}
.back{background:none;border:0;padding:0;color:var(--accent);font-weight:700;align-self:flex-start}
.carrier{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.carrier strong{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:20px;border:1px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.dm{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.dm .top{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.dm .top b{color:var(--ink)}
.dm p{margin:0}
.dm.done{opacity:.6}
.conn{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.conn .logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;grid-row:span 2}
.conn .logo.ig{background:var(--ig-soft);color:var(--ig)}
.conn .logo.wa{background:var(--wa-soft);color:var(--wa)}
.conn .st{font-size:13px;color:var(--muted)}
.conn .st.on{color:var(--accent);font-weight:700}
.sim{border:2px dashed var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.sim ul{margin:0;padding-left:18px;font-size:14px}
.prod{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.prod .pname{font-weight:700}
.prod .pprice{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.prod .kw{font-size:12px;color:var(--muted);grid-column:1/-1}
.stockrow{grid-column:1/-1;display:flex;align-items:center;gap:8px;justify-content:space-between}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:17px}
.stepper span{min-width:34px;text-align:center;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-weight:700}
.total strong{font-size:22px;font-variant-numeric:tabular-nums}
/* login */
.login{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:20px;padding-block:32px}
.login .logo{font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:-.03em;line-height:1}
.login .logo i{font-style:normal;color:var(--accent)}
.demo{background:var(--amber-soft);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.demo code{font-family:ui-monospace,Menlo,monospace;font-weight:700;background:var(--surface);padding:2px 6px;border-radius:6px}
.err{color:var(--red);font-size:13.5px;font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav button{background:none;border:0;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);position:relative}
nav svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--accent);font-weight:700}
nav .add .pb{width:44px;height:44px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-18px}
nav .dot{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav aria-label="Main" id="nav" hidden><div class="in">
  <button type="button" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>Today</button>
  <button type="button" data-tab="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Orders</button>
  <button type="button" data-tab="add" class="add"><span class="pb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></span>New</button>
  <button type="button" data-tab="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"/></svg>Products<span class="dot" id="stockDot" hidden></span></button>
  <button type="button" data-tab="cash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>Cash</button>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const STATUSES=["new","confirmed","shipped","delivered","paid"];
const LABEL={new:"To confirm",confirmed:"Confirmed",shipped:"Shipped",delivered:"Delivered",paid:"Paid",refused:"Refused"};
const CARRIERS=["Ozon Express","Sendit","Amana"];
const SHIP=30,LOW=5,D=86400000,MIN=60000,now=Date.now();

/* ---------- built-in knowledge for the backup filler ---------- */
const NAMES=("Mohamed Mohammed Ahmed Youssef Yassine Amine Omar Hamza Mehdi Karim Rachid Said Hassan Hicham Khalid Abdelali Abdellah Abderrahim Abdelkader Adil Anas Ayoub Bilal Brahim Driss Ilyas Imad Ismail Jamal Mustapha Mourad Nabil Noureddine Othmane Reda Saad Samir Soufiane Tarik Walid Zakaria Younes Achraf Badr Hakim Ali Aziz Fouad Hamid Larbi Mounir Nordine Rida Taha Yahya Zouhair Ilias Marouane Ayman Aymane Hatim Salah Jawad "+
 "Fatima Fatimazahra Khadija Aicha Aïcha Meryem Maryam Salma Sara Sarah Sanaa Hajar Imane Ikram Houda Nadia Najat Naima Hanane Hind Zineb Zahra Latifa Loubna Kenza Karima Asmae Asmaa Amal Aya Nora Nour Rim Ghita Ghizlane Siham Soukaina Wiam Yasmine Yousra Chaimae Chaima Dounia Fadwa Btissam Ibtissam Laila Leila Malika Rachida Samira Souad Wafae Oumaima Rania Manal Mouna Lamia Nisrine Safae Sofia Ines Inès Hiba Douae Lina Rajae Bouchra Halima Jamila Mariam Nawal Sabrina Zakia Khaoula Fatiha Mina Hasna Hayat").split(/\s+/);
const NAMESET=new Set(NAMES.map(n=>norm(n)));
const CITIES=[["Casablanca","casablanca|casa|dar bouazza|ain sebaa|maarif|sidi maarouf|hay hassani|bernoussi"],["Rabat","rabat|agdal|hay riad"],["Salé","sale"],["Témara","temara"],["Kénitra","kenitra"],["Tanger","tanger|tangier|tanja"],["Tétouan","tetouan|tetuan|titwan"],["Fès","fes|fez|fas"],["Meknès","meknes|mknas"],["Marrakech","marrakech|marrakesh|mrakch"],["Agadir","agadir"],["Oujda","oujda"],["Nador","nador"],["El Jadida","el jadida|jdida"],["Safi","safi|asfi"],["Essaouira","essaouira|souira"],["Béni Mellal","beni mellal"],["Khouribga","khouribga"],["Settat","settat"],["Mohammedia","mohammedia|mohamedia"],["Larache","larache"],["Taza","taza"],["Errachidia","errachidia"],["Ouarzazate","ouarzazate"],["Laâyoune","laayoune|layoune"],["Dakhla","dakhla"],["Tiznit","tiznit"],["Berrechid","berrechid"],["Khémisset","khemisset"],["Al Hoceima","al hoceima|hoceima"],["Ifrane","ifrane"],["Taroudant","taroudant"],["Guelmim","guelmim"]];
const ADDR=/\b(rue|zanqa|znqa|av|ave|avenue|bd|boulevard|hay|7ay|derb|quartier|qartier|residence|res|résidence|lot|lotissement|imm|immeuble|n°|no|numero|numéro|appt|appartement|etage|étage|douar|cite|cité|secteur|bloc|villa|jnane)\b/i;
const QTYW={joj:2,jouj:2,zouj:2,zoj:2,deux:2,two:2,tlata:3,tlat:3,trois:3,three:3,rb3a:4,quatre:4,four:4};
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()}
const cap=s=>s.replace(/(^|[\s-])([a-zà-ÿ])/g,(m,a,b)=>a+b.toUpperCase());

function seed(){return{user:null,accounts:[],shops:{}};}
function newShop(){return{products:[],orders:[],next:1}}
const KEY="talabia-app-v1";
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.shops||!S.accounts)S=seed();
if(S.user&&!S.shops[S.user])S.user=null;
const SH_=()=>S.shops[S.user];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dh=n=>(+n||0).toLocaleString("fr-MA")+" DH";
const ago=t=>{const d=Date.now()-t;return d<60*MIN?Math.max(1,Math.round(d/MIN))+" min":d<D?Math.round(d/3600000)+" h":Math.round(d/D)+" d"};
const toast=m=>{const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.k);toast.k=setTimeout(()=>t.hidden=true,2800)};
const refusedBefore=o=>SH_().orders.filter(x=>x.phone===o.phone&&x.id!==o.id&&x.status==="refused").length;
const shop=()=>(S.accounts.find(a=>a.phone===S.user)||{}).shop||"My shop";
const prod=id=>SH_().products.find(p=>p.id===id);
const stockCls=p=>p.stock<=0?"out":p.stock<LOW?"low":"ok";
const stockTxt=p=>p.stock<=0?"Out of stock":p.stock<LOW?`Only ${p.stock} left`:`${p.stock} in stock`;
let route={tab:"today"},filter="all",authMode=S.accounts.length?"login":"signup",editProd=null,priceTouched=false,newSrc="ig";
const app=document.getElementById("app"),nav=document.getElementById("nav");
const go=r=>{route=r;render();scrollTo(0,0)};

/* ---------- smart fill: names list, cities, address words, catalog keywords (free, runs on the phone) ---------- */
function ruleParse(txt){
 const raw=String(txt||""),n=norm(raw);
 let phone=(raw.replace(/\+\s*212\s*/g,"0").match(/0[5-7](?:[\s.-]?\d){8}/)||[""])[0].replace(/\D/g,"");
 let city="";for(const [c,re] of CITIES){if(new RegExp("\\b("+re+")\\b").test(n)){city=c;break}}
 // name: after a cue word, else first token found in the names list (+ following capitalised word as surname)
 let name="";
 const cue=raw.match(/(?:smiti|smiyti|ana|je suis|je m'appelle|moi c'est|nom\s*:|name\s*:|my name is|اسمي)\s+([A-Za-zÀ-ÿ'-]+(?:\s+(?:El|Al|Ben|Ait|Aït)?\s*[A-ZÀ-Ý][A-Za-zÀ-ÿ'-]+)?)/i);
 if(cue)name=cue[1];
 else{const toks=raw.split(/[\s,.;:!?]+/);
  for(let i=0;i<toks.length;i++){const t=toks[i];
   if(NAMESET.has(norm(t))){name=t;
    if(norm(t)==="fatima"&&/^zahra$/i.test(toks[i+1]||"")){name+=" "+toks[i+1];i++}
    let j=i+1;const parts=[];
    while(j<toks.length&&parts.length<2){const w=toks[j];
     if(/^(el|al|ben|ait|aït)$/i.test(w)){parts.push(w);j++;continue}
     if(/^[A-ZÀ-Ý][a-zà-ÿ'-]{2,}$/.test(w)&&!CITIES.some(([c,re])=>new RegExp("^("+re+")$").test(norm(w)))&&!ADDR.test(w)){parts.push(w)}break}
    if(parts.length&&!/^(el|al|ben|ait|aït)$/i.test(parts[parts.length-1]))name+=" "+parts.join(" ");
    break}}}
 name=name?cap(name.toLowerCase()):"";
 // address: comma-separated parts that contain address words, minus phone and city words
 const segs=raw.split(/[,\n;]+/).map(s=>s.trim()).filter(Boolean);
 let address=segs.filter(s=>ADDR.test(norm(s))&&!/0[5-7](?:[\s.-]?\d){8}/.test(s)).map(s=>{
   let x=s;
   if(/\b(salam|slm|bghit|bonjour|bonsoir|je voudrais|je veux|wach|3afak|svp|merci)\b/i.test(norm(x))){const m=x.match(ADDR);if(m)x=x.slice(m.index)}
   if(city){for(const [c,re] of CITIES)if(c===city)x=x.replace(new RegExp("\\b("+re+")\\b","ig"),"")}
   if(name)x=x.replace(new RegExp(name.split(" ")[0],"i"),"");
   return x.replace(/^(ana|smiti|tel|tél)\b/i,"").replace(/\s{2,}/g," ").trim()}).filter(s=>s.length>2).join(", ");
 // product: catalog keyword with most hits
 let best=null,score=0;
 for(const p of SH_().products){let sc=0;for(const k of (p.kw+","+p.name).split(",").map(x=>norm(x.trim())).filter(Boolean)){if(n.includes(k))sc+=k.length}if(sc>score){score=sc;best=p}}
 // quantity
 let qty=1;const qm=n.match(/(?:x\s*(\d{1,2})|(\d{1,2})\s*(?:x|pieces|pcs|pièces|7abat|hbat|unites)\b)/);
 if(qm)qty=+(qm[1]||qm[2]);else for(const [w,q] of Object.entries(QTYW))if(new RegExp("\\b"+w+"\\b").test(n)){qty=q;break}
 return{name,phone,city,address,productId:best?best.id:"",qty:Math.max(1,Math.min(qty,50))};
}

/* ---------- order form logic ---------- */
const $=id=>document.getElementById(id);
function wireForm(){
 priceTouched=false;
 $("fPhone").addEventListener("input",dupCheck);
 $("fProduct").addEventListener("change",()=>{priceTouched=false;recalc()});
 $("fQty").addEventListener("input",()=>{priceTouched=false;recalc()});
 $("fPrice").addEventListener("input",()=>{priceTouched=true});
 ["fName","fPhone","fCity","fAddress","fProduct","fQty","fPrice"].forEach(id=>$(id).addEventListener("input",()=>$(id).classList.remove("auto")));
}
function recalc(){
 const p=prod($("fProduct").value),q=Math.max(1,+$("fQty").value||1);
 if(p&&!priceTouched)$("fPrice").value=p.price*q;
 const n=$("stockNote");
 if(!p){n.innerHTML="";return}
 n.innerHTML=p.stock<=0?`<div class="warnbox">⚠ ${esc(p.name)} is out of stock. Restock it in Products or tell the customer.</div>`:
  q>p.stock?`<div class="warnbox">⚠ Only ${p.stock} ${esc(p.name)} left, the customer wants ${q}.</div>`:
  `<div class="hint">${p.price} DH each × ${q} · ${p.stock} in stock, ${p.stock-q} left after this order</div>`;
}
function dupCheck(){const p=$("fPhone").value.replace(/\D/g,"");const n=SH_().orders.filter(o=>o.phone===p&&o.status==="refused").length;
 $("dupWarn").innerHTML=n?`<div class="warnbox">⚠ This number refused ${n} order${n>1?"s":""} before.</div>`:""}
function runFill(){
 const txt=$("paste").value.trim();
 if(!txt){toast("Paste the customer's message first");return}
 const {data}=smartParse(txt);
 const set=(id,v)=>{if(v!==""&&v!=null){$(id).value=v;$(id).classList.add("auto")}};
 set("fName",data.name);set("fPhone",data.phone);set("fCity",data.city);set("fAddress",data.address);
 if(data.productId){$("fProduct").value=data.productId;$("fProduct").classList.add("auto")}
 set("fQty",data.qty);priceTouched=false;recalc();if(data.productId)$("fPrice").classList.add("auto");
 dupCheck();
 const missing=[["name","name"],["phone","phone"],["city","city"],["address","address"],["productId","product"]].filter(([k])=>!data[k]).map(([,l])=>l);
 $("fillNote").innerHTML=`<div class="aibox">✨ Filled automatically. Purple fields were filled automatically, check them before saving.${missing.length?` Not found: ${missing.join(", ")}.`:""}</div>`;
}

 if(el.id==="logout"){S.user=null;confirmDelete=false;save();authMode="login";go({tab:"today"});return}
 if(d.tab){editProd=null;go({tab:d.tab});return}
 if(d.filterGo){filter=d.filterGo;go({tab:"orders"});return}
 if(d.filter){filter=d.filter;render();return}
 if(d.open){go({tab:"detail",id:+d.open});return}
 if(d.src){newSrc=d.src;document.querySelectorAll("#srcPick .chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.src===newSrc));return}
 if(d.copy){const o=SH_().orders.find(x=>x.id==d.copy),txt=confirmMsg(o);
   const fallback=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("cmsg"));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast("Message selected, copy it from your phone menu")};
   try{navigator.clipboard.writeText(txt).then(()=>toast("Message copied. Paste it in Instagram."),fallback)}catch(err){fallback()}return}
 if(d.advance){const o=SH_().orders.find(x=>x.id==d.advance);o.status=STATUSES[STATUSES.indexOf(o.status)+1];save();toast(LABEL[o.status]);render();return}
 if(d.refuse){const o=SH_().orders.find(x=>x.id==d.refuse);const was=o.status==="shipped";o.status="refused";returnStock(o);save();toast((was?`Refused · ${SHIP} DH shipping lost`:"Cancelled · nothing lost")+` · ${o.qty} back in stock`);render();return}
 if(d.payout){SH_().orders.filter(o=>o.carrier===d.payout&&o.status==="delivered").forEach(o=>o.status="paid");save();toast(`${d.payout} payout recorded`);render();return}
 if(d.stock){const p=prod(d.stock);p.stock=Math.max(0,p.stock+(+d.d));save();render();return}
 if(d.edit){editProd=d.edit;render();return}
 if(el.id==="pCancel"){editProd=null;render();return}
 if(el.id==="pSave"){const name=$("pName").value.trim(),price=+$("pPrice").value,stock=Math.max(0,parseInt($("pStock").value)||0),kw=$("pKw").value.trim();
   if(!name||!(price>0)){toast("Add a name and a price");return}
   if(d.id){Object.assign(prod(d.id),{name,price,stock,kw})}else SH_().products.push({id:"p"+Date.now(),name,price,stock,kw});
   editProd=null;save();toast("Product saved");render();return}
 if(el.id==="pDelete"){SH_().products=SH_().products.filter(p=>p.id!==d.id);editProd=null;save();toast("Product deleted");render();return}
 if(el.id==="fill"){runFill();return}
 if(el.id==="saveOrder"){const g=id=>$(id).value.trim();
   const p=prod(g("fProduct")),qty=Math.max(1,+g("fQty")||1);
   if(!g("fName")||g("fPhone").replace(/\D/g,"").length<10||!p){toast("Add a name, a 10-digit phone and a product");return}
   const o={id:SH_().next++,name:g("fName"),phone:g("fPhone").replace(/\D/g,""),city:g("fCity")||"—",address:g("fAddress"),productId:p.id,qty,product:p.name,price:+g("fPrice")||p.price*qty,status:"new",carrier:g("fCarrier"),t:Date.now()};
   if(newSrc!=="other")o.src=newSrc;
   takeStock(o);SH_().orders.push(o);save();
   toast(`Order saved · ${p.name}: ${p.stock} left`);go({tab:"detail",id:o.id});return}
});
render();
})();
</script>
<script>
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
