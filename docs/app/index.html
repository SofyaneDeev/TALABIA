<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talabia</title>
<meta name="theme-color" content="#0f6b4f">
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&family=Cairo:wght@500;600;700&display=swap">
<style>
/* Layout: phone-width column, sticky header, fixed bottom tabs; a seller's order book in the pocket. */
:root{
  --bg:#f3f2ee; --surface:#ffffff; --ink:#1b1d1a; --muted:#64685f; --line:#e2e1da;
  --accent:#0f6b4f; --accent-ink:#ffffff; --accent-soft:#dcefe6;
  --amber:#94600f; --amber-soft:#fbefd6; --red:#b0351f; --red-soft:#f9e1dc; --blue:#2f5fa8; --blue-soft:#e1e9f6;
  --ig:#9e2f6b; --ig-soft:#f6e0ec; --wa:#17773f; --wa-soft:#dbf1e3; --ai:#6b4fd1; --ai-soft:#ebe6fb;
  --conf:#a3500a; --conf-soft:#fbe6d2; --ship:#5b4bc4; --ship-soft:#e6e2f8; --paid:#0b6a72; --on-solid:#ffffff; --paid-soft:#d5edef;
  --display:"Sora",ui-sans-serif,system-ui,sans-serif; --body:"Manrope",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111311; --surface:#1b1e1b; --ink:#eef0ea; --muted:#a2a79b; --line:#2d312c;
  --accent:#4cc79b; --accent-ink:#0d1a14; --accent-soft:#163428;
  --amber:#e8b55a; --amber-soft:#3a2e15; --red:#f0826e; --red-soft:#3d1d17; --blue:#8bb0ee; --blue-soft:#1b2840;
  --ig:#ee8fc0; --ig-soft:#3a1d2d; --wa:#5fd394; --wa-soft:#15331f; --ai:#b4a2ff; --ai-soft:#2a2347;
  --conf:#f2a65a; --conf-soft:#3a2813; --ship:#a99bff; --ship-soft:#272046; --paid:#5cc8d1; --paid-soft:#12302f; --on-solid:#0d1410; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111311; --surface:#1b1e1b; --ink:#eef0ea; --muted:#a2a79b; --line:#2d312c;
  --accent:#4cc79b; --accent-ink:#0d1a14; --accent-soft:#163428;
  --amber:#e8b55a; --amber-soft:#3a2e15; --red:#f0826e; --red-soft:#3d1d17; --blue:#8bb0ee; --blue-soft:#1b2840;
  --ig:#ee8fc0; --ig-soft:#3a1d2d; --wa:#5fd394; --wa-soft:#15331f; --ai:#b4a2ff; --ai-soft:#2a2347;
  --conf:#f2a65a; --conf-soft:#3a2813; --ship:#a99bff; --ship-soft:#272046; --paid:#5cc8d1; --paid-soft:#12302f; --on-solid:#0d1410; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:460px;margin:0 auto;min-height:100%}
@media(min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.proto{font-size:12px;color:var(--muted);background:var(--amber-soft);padding-block:7px;display:flex;justify-content:space-between;gap:10px}
.proto button{background:none;border:0;text-decoration:underline;font-size:12px;padding:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--accent)}
.probtn{flex:none;display:flex;align-items:center;gap:4px;border:0;border-radius:999px;padding:7px 12px;min-height:40px;font-size:13px;font-weight:800;color:#5a3d00;background:linear-gradient(180deg,#ffd76a,#f2b632);box-shadow:0 4px 12px -6px rgba(183,121,31,.7)}
.probtn.on{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.shopbtn{display:flex;align-items:center;gap:8px;min-height:40px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 5px;font-size:13px;font-weight:600;min-width:0}
.shopbtn .av{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:11px;flex:none}
main{padding-block:16px 96px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:24px;letter-spacing:-.02em}
h2{font-size:16px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.sub{color:var(--muted);margin:2px 0 0;font-size:13.5px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left}
.kpi strong{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.warn strong{color:var(--red)}
.kpi.big{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);width:100%}
.kpi.big span{color:var(--accent-ink);opacity:.85}
.kpi.big strong{font-size:32px}
.todo{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.todo button{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;text-align:left;gap:10px}
.todo button:first-child{border-top:0}
.count{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;border-radius:8px;padding:2px 9px;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:40px;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;width:100%}
.order b{font-size:15px}
.order .price{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.order .info{font-size:13px;color:var(--muted);min-width:0}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;justify-self:end;white-space:nowrap}
.s-new{background:var(--blue-soft);color:var(--blue)}
.s-low{background:var(--amber-soft);color:var(--amber)}
.s-confirmed{background:var(--conf-soft);color:var(--conf)}
.s-shipped{background:var(--ship-soft);color:var(--ship)}
.s-delivered,.s-ok{background:var(--accent-soft);color:var(--accent)}
.s-paid{background:var(--paid-soft);color:var(--paid)}
.s-refused,.s-out{background:var(--red-soft);color:var(--red)}
.src{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.src.ig{background:var(--ig-soft);color:var(--ig)}
.src.wa{background:var(--wa-soft);color:var(--wa)}
.flag{color:var(--red);font-weight:700;font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 14px;font-weight:700;text-decoration:none;text-align:center;display:block;width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red-soft);color:var(--red)}
.btn.wa{background:var(--wa);color:var(--on-solid)}
.btn.ig{background:var(--ig);color:var(--on-solid)}
.btn.ai{background:var(--ai);color:var(--on-solid)}
.btn.link{background:none;color:var(--accent);padding:6px;width:auto;min-height:40px}
.btn.sm{padding:7px 12px;font-size:13.5px;width:auto;min-height:40px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.media{display:flex;gap:8px;flex-wrap:wrap}.media .btn{flex:1}
.payline{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.payline b{font-variant-numeric:tabular-nums;text-align:end}
.paybox{display:flex;flex-direction:column;gap:2px;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.rcpt{width:100%;max-height:340px;object-fit:contain;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.mchip{display:flex;align-items:center;gap:10px;background:var(--ai-soft);border:1px solid var(--ai);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:600;color:var(--ink)}
.mchip img{width:44px;height:44px;object-fit:cover;border-radius:8px}.mchip audio{height:34px;flex:1;min-width:0}.mchip .x{margin-left:auto;background:none;border:0;font-size:18px;color:var(--muted);padding:4px 6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
input,textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:15px;transition:background .3s,border-color .3s}
input.auto,select.auto,textarea.auto{background:var(--ai-soft);border-color:var(--ai)}
textarea{min-height:80px;resize:vertical}
.warnbox{background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 12px;font-weight:600;font-size:13.5px}
.okbox{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-weight:600;font-size:13.5px}
.aibox{background:var(--ai-soft);color:var(--ai);border-radius:12px;padding:10px 12px;font-weight:600;font-size:13.5px}
.steps{display:flex;gap:4px}
.steps span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--accent)}
.steps span.bad{background:var(--red)}
.msg{background:var(--accent-soft);border-radius:12px 12px 12px 4px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.msg.in{background:var(--bg);border:1px solid var(--line);border-radius:12px 12px 4px 12px}
.back{background:none;border:0;padding:10px 4px 10px 0;margin:-10px 0;min-height:40px;color:var(--accent);font-weight:700;align-self:flex-start}
.carrier{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.carrier strong{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:20px;border:1px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.dm{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.dm .top{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.dm .top b{color:var(--ink)}
.dm p{margin:0}
.dm.done{opacity:.6}
.conn{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.conn .logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;grid-row:span 2}
.conn .logo.ig{background:var(--ig-soft);color:var(--ig)}
.conn .logo.wa{background:var(--wa-soft);color:var(--wa)}
.conn .st{font-size:13px;color:var(--muted)}
.conn .st.on{color:var(--accent);font-weight:700}
.sim{border:2px dashed var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.sim ul{margin:0;padding-left:18px;font-size:14px}
.prod{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.prod.hasimg{grid-template-columns:58px 1fr auto}.prod .pthumb{width:58px;height:58px;border-radius:12px;object-fit:cover;grid-row:span 2;background:var(--bg);border:1px solid var(--line)}
.prod.hasimg .kw,.prod.hasimg .stockrow{grid-column:1/-1}
.pphoto{display:flex;align-items:center;gap:12px}.pphoto .ph{width:84px;height:84px;border-radius:14px;object-fit:cover;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;color:var(--muted);font-size:28px;flex:none}
.pphoto .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:48px 1fr auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.item.auto{border-color:var(--ai);background:var(--ai-soft)}
.th{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;color:var(--accent);flex:none}
.item .iname{display:flex;flex-direction:column;min-width:0}.item .iname b{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25;font-size:14.5px}.item .iname small{color:var(--muted);font-size:12.5px}
.item .ix{background:none;border:0;color:var(--muted);font-size:22px;width:34px;height:34px;padding:0}
.plist{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:14px;padding:8px;background:var(--bg);max-height:330px;overflow:auto}
.plist input{margin-bottom:2px}
.prow{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:start;color:var(--ink);width:100%}
.prow span{display:flex;flex-direction:column;min-width:0}.prow small{color:var(--muted);font-size:12.5px}
.dimg{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;border:1px solid var(--line)}
.prod .pname{font-weight:700}
.prod .pprice{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.prod .kw{font-size:12px;color:var(--muted);grid-column:1/-1}
.stockrow{grid-column:1/-1;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;min-width:0}
.stockrow .stepper{flex-wrap:nowrap;margin-inline-start:auto}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:17px}
.stepper span{min-width:34px;text-align:center;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-weight:700}
.total strong{font-size:22px;font-variant-numeric:tabular-nums}
/* login */
.login{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:20px;padding-block:32px}
.login .logo{font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:-.03em;line-height:1}
.login .logo i{font-style:normal;color:var(--accent)}
.demo{background:var(--amber-soft);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.demo code{font-family:ui-monospace,Menlo,monospace;font-weight:700;background:var(--surface);padding:2px 6px;border-radius:6px}
.pwwrap{position:relative;display:block}
input.haseye{padding-inline-end:46px!important}
.eye{position:absolute;inset-inline-end:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;padding:0;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:10px;cursor:pointer;z-index:2}
.eye svg{width:21px;height:21px}.eye:focus-visible{outline:2px solid var(--accent)}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plan{position:relative;display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;color:var(--ink)}
.plan[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.plan b{font-size:15px}.plan .pm{font-family:var(--display);font-weight:700;color:var(--accent);font-size:15px}.plan small{color:var(--muted);font-size:12.5px}
.plan .save{position:absolute;top:8px;inset-inline-end:8px;background:var(--amber);color:var(--on-solid);border-radius:999px;padding:1px 7px;font-size:12px;font-weight:700}
.tzhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tzchip{flex:none;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:800;color:#5a3d00;background:linear-gradient(180deg,#ffd76a,#f2b632)}
.tzmock{position:relative;border:1px solid var(--line);border-radius:20px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px;pointer-events:none;overflow:hidden;max-height:400px;box-shadow:0 14px 30px -22px rgba(0,0,0,.35)}
.tzmock::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(transparent,var(--surface))}
.tzmock .ex{align-self:flex-end;margin:-4px -4px -4px 0;font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;z-index:1}
.tzk{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tzk>div{background:var(--bg);border-radius:12px;padding:10px}.tzk span{display:block;font-size:12px;color:var(--muted)}.tzk b{font-family:var(--display);font-size:19px}
.tzbars{display:flex;align-items:flex-end;gap:6px;height:74px;padding:0 4px}.tzbars i{flex:1;border-radius:6px 6px 2px 2px;background:var(--accent);opacity:.85}
.tzrow{display:flex;align-items:center;gap:10px;font-size:13.5px}.tzrow .av{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.tzrow .grow{flex:1;min-width:0}.tzrow small{display:block;color:var(--muted);font-size:12px}
.tztag{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--red-soft);color:var(--red)}.tztag.ok{background:var(--accent-soft);color:var(--accent)}
.tzbar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden}.tzbar i{display:block;height:100%;background:var(--amber)}
.tzmsg{background:var(--wa-soft);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.5;white-space:pre-line}.tzmsg em{font-style:normal;font-weight:700;color:var(--accent)}
.tzben{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}.tzben li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}.tzben li::before{content:"✓";flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px}
.armed{outline:2px solid var(--red);outline-offset:2px}
.okbox{color:var(--accent);font-size:13.5px;font-weight:600;background:var(--accent-soft);padding:8px 10px;border-radius:10px}
.err{color:var(--red);font-size:13.5px;font-weight:600;background:var(--red-soft);padding:8px 10px;border-radius:10px;animation:shake .4s var(--ease)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav button{background:none;border:0;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);position:relative}
nav svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--accent);font-weight:700}
nav .add .pb{width:44px;height:44px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-18px}
nav .dot{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:var(--on-solid);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}

async function authCall(path,body){
 const r=await fetch(CONFIG.url+"/auth/v1/"+path,{method:"POST",headers:{apikey:CONFIG.anon,"content-type":"application/json"},body:JSON.stringify(body)});
 const j=await r.json().catch(()=>({}));return{ok:r.ok,status:r.status,j}}
function takeSession(j){session={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+((j.expires_in||3600)-60)*1000,uid:(j.user&&j.user.id)||(session&&session.uid)};saveSession()}
async function token(){
 if(!session)return null;if(Date.now()<session.exp)return session.access;
 try{const r=await authCall("token?grant_type=refresh_token",{refresh_token:session.refresh});
  if(r.ok){takeSession(r.j);return session.access}
  if(r.status>=400&&r.status<500){session=null;saveSession()}}catch(e){}
 return null}
async function api(path,opt){opt=opt||{};const t=await token();if(!t)throw{code:"auth"};

 if(!r.ok)throw{code:"http",status:r.status};

}

function syncStock(sh){if(!sh)return;const now=Date.now();
 sh.products.forEach(p=>{if(p.base==null){p.base=Math.max(0,+p.stock||0);p.baseT=now}

/* ---------- smart fill: names list, cities, address words, catalog keywords (free, runs on the phone) ---------- */
function ruleParse(txt){
 const raw=String(txt||""),n=norm(raw);
 let phone=(raw.replace(/\+\s*212\s*/g,"0").match(/0[5-7](?:[\s.-]?\d){8}/)||[""])[0].replace(/\D/g,"");
 let city="";for(const [c,re] of CITIES){if(new RegExp("\\b("+re+")\\b").test(n)){city=c;break}}
 // name: after a cue word, else first token found in the names list (+ following capitalised word as surname)
 let name="";
 const cue=raw.match(/(?:smiti|smiyti|ana|je suis|je m'appelle|moi c'est|nom\s*:|name\s*:|my name is|اسمي)\s+([A-Za-zÀ-ÿ'-]+(?:\s+(?:El|Al|Ben|Ait|Aït)?\s*[A-ZÀ-Ý][A-Za-zÀ-ÿ'-]+)?)/i);
 if(cue)name=cue[1];
 else{const toks=raw.split(/[\s,.;:!?]+/);
  for(let i=0;i<toks.length;i++){const t=toks[i];
   if(NAMESET.has(norm(t))){name=t;
    if(norm(t)==="fatima"&&/^zahra$/i.test(toks[i+1]||"")){name+=" "+toks[i+1];i++}
    let j=i+1;const parts=[];
    while(j<toks.length&&parts.length<2){const w=toks[j];
     if(/^(el|al|ben|ait|aït)$/i.test(w)){parts.push(w);j++;continue}
     if(/^[A-ZÀ-Ý][a-zà-ÿ'-]{2,}$/.test(w)&&!CITIES.some(([c,re])=>new RegExp("^("+re+")$").test(norm(w)))&&!ADDR.test(w)){parts.push(w)}break}
    if(parts.length&&!/^(el|al|ben|ait|aït)$/i.test(parts[parts.length-1]))name+=" "+parts.join(" ");
    break}}}
 name=name?cap(name.toLowerCase()):"";
 // address: comma-separated parts that contain address words, minus phone and city words
 const segs=raw.split(/[,\n;]+/).map(s=>s.trim()).filter(Boolean);
 let address=segs.filter(s=>ADDR.test(norm(s))&&!/0[5-7](?:[\s.-]?\d){8}/.test(s)).map(s=>{
   let x=s;
   if(/\b(salam|slm|bghit|bonjour|bonsoir|je voudrais|je veux|wach|3afak|svp|merci)\b/i.test(norm(x))){const m=x.match(ADDR);if(m)x=x.slice(m.index)}
   if(city){for(const [c,re] of CITIES)if(c===city)x=x.replace(new RegExp("\\b("+re+")\\b","ig"),"")}
   if(name)x=x.replace(new RegExp(name.split(" ")[0],"i"),"");
   return x.replace(/^(ana|smiti|tel|tél)\b/i,"").replace(/\s{2,}/g," ").trim()}).filter(s=>s.length>2).join(", ");
 // product: catalog keyword with most hits
 let best=null,score=0;const hits=[];
 for(const p of SH_().products){let sc=0;for(const k of (p.kw+","+p.name).split(",").map(x=>norm(x.trim())).filter(Boolean)){if(n.includes(k))sc+=k.length}if(sc>=4)hits.push([sc,p]);if(sc>score){score=sc;best=p}}
 hits.sort((x,y)=>y[0]-x[0]);
 // quantity
 let qty=1;const qm=n.match(/(?:x\s*(\d{1,2})|(\d{1,2})\s*(?:x|pieces|pcs|pièces|7abat|hbat|unites)\b)/);
 if(qm)qty=+(qm[1]||qm[2]);else for(const [w,q] of Object.entries(QTYW))if(new RegExp("\\b"+w+"\\b").test(n)){qty=q;break}
 qty=Math.max(1,Math.min(qty,50));
 const items=hits.slice(0,5).map(([,p],i)=>({productId:p.id,qty:i===0?qty:1}));
 return{name,phone,city,address,productId:best?best.id:"",qty,items:items.length?items:(best?[{productId:best.id,qty}]:[])};
}

const AI_MODEL="claude-haiku-5-5";

function aiPrompt(txt,kind){
 const catalog=SH_().products.map(p=>({id:p.id,name:p.name,price:p.price,words:p.kw}));
 return `You read a customer's message sent to a small online shop in Morocco and extract the order.
The message can mix Moroccan Darija (in Latin letters with numbers like 3, 7, 9 — or in Arabic script), French, Arabic and English, with typos and in any order.
The shop's products (JSON): ${JSON.stringify(catalog)}
${kind==="image"?"The order is in the attached picture (usually a screenshot of an Instagram or WhatsApp chat). Read only the customer's messages, not the seller's replies.\n":""}Reply with ONLY one JSON object and nothing else:
{"name": the customer's name (first and family name if given; never a product, city or street) or null,
 "phone": Moroccan number as 10 digits starting with 05, 06 or 07 (convert +212 or 00212 to 0) or null,
 "city": Moroccan city in its usual French spelling (e.g. Casablanca, Fès, Tétouan, Marrakech) or null,
 "address": delivery address without the city and name: neighborhood (hay/quartier), street (zanqa/rue/bd), building, apartment, lot, number, landmark — or null,
 "items": EVERY catalog product the customer wants, as a list of {"productId": the catalog id, "qty": how many (Darija: wa7d=1, joj/jouj/zouj=2, tlata=3, rb3a=4; default 1)} — one entry per different product, [] if none matches,
 "productAsked": what the customer asked for in their own words when a product is not in the catalog, else null,
 "note": short useful details for the seller such as size, color, delivery time or a question the customer asked, else null${kind?`,
 "heard": the customer's words as you read them, in Latin letters the way Moroccans text (max 400 characters)`:""}}
Do not invent anything: use null when something is not in the order.${String(txt).trim()?`
Message:
"""${String(txt).slice(0,2500)}"""`:""}`;
}
function cleanAI(r,txt){
 if(!r||typeof r!=="object")return null;
 const out={name:r.name?String(r.name).trim():"",phone:r.phone?normPhone(r.phone):"",city:r.city?String(r.city).trim():"",address:r.address?String(r.address).trim():"",
  productId:r.productId&&prod(String(r.productId))?String(r.productId):"",productAsked:r.productAsked?String(r.productAsked).trim():"",
  qty:Math.max(1,Math.min(parseInt(r.qty)||1,50)),items:[],note:r.note?String(r.note).trim():"",heard:r.heard?String(r.heard).trim().slice(0,600):""};
 if(Array.isArray(r.items))r.items.forEach(i=>{const id=i&&i.productId!=null?String(i.productId):"";if(id&&prod(id)&&!out.items.some(x=>x.productId===id))out.items.push({productId:id,qty:Math.max(1,Math.min(parseInt(i.qty)||1,50))})});
 if(!out.items.length&&out.productId)out.items.push({productId:out.productId,qty:out.qty});
 if(out.items.length&&!out.productId){out.productId=out.items[0].productId;out.qty=out.items[0].qty}
 if(out.phone&&!/^0[5-7]\d{8}$/.test(out.phone))out.phone="";
 const rb=ruleParse(txt);for(const k of ["name","phone","city","address","productId"])if(!out[k])out[k]=rb[k];
 if(!out.items.length&&rb.items&&rb.items.length&&!r.productAsked)out.items=rb.items;
 return out;
}
/* ---------- photo / voice note for Smart fill ---------- */
let newMedia=null; // {kind:"image"|"audio",mime,name,size,data(base64),url,blob}
const AUDIO_OK=/^(audio\/(ogg|opus|mpeg|mp3|wav|x-wav|aac|mp4|x-m4a|m4a|flac|webm)|application\/ogg)/i;
function mediaChip(){if(!newMedia)return"";const kb=Math.max(1,Math.round(newMedia.size/1024));
 return `<div class="mchip">${newMedia.kind==="image"?`<img src="${newMedia.url}" alt="">`:`<audio controls src="${newMedia.url}"></audio>`}<span>${newMedia.kind==="image"?"Screenshot":"Voice note"} · ${kb>999?(kb/1024).toFixed(1)+" MB":kb+" KB"}</span><button type="button" class="x" id="mediaX" aria-label="Remove">✕</button></div>`}
function showMedia(){const c=$("mediaChip");if(c)c.innerHTML=mediaChip()}
function clearMedia(){if(newMedia&&newMedia.url)try{URL.revokeObjectURL(newMedia.url)}catch(e){}newMedia=null;showMedia()}
const b64=buf=>{let s="",a=new Uint8Array(buf);for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s)};
function shrinkImage(file){return new Promise(res=>{const img=new Image(),u=URL.createObjectURL(file);
 img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b||file),"image/jpeg",.85)};
 img.onerror=()=>{URL.revokeObjectURL(u);res(file)};img.src=u})}
async function takeMedia(file){
 if(!file)return;const type=(file.type||"").toLowerCase(),name=file.name||"";
 const isAud=AUDIO_OK.test(type)||/\.(opus|ogg|m4a|mp3|aac|wav)$/i.test(name),isImg=type.startsWith("image/")||(!type&&!isAud);
 if(!isImg&&!isAud){toast("Choose a picture");return}
 let blob=file;if(isImg)blob=await shrinkImage(file);
 if(blob.size>10*1024*1024){toast("This file is too big (10 MB max)");return}
 let mime=isImg?(blob.type||"image/jpeg"):(type||(/\.m4a$/i.test(name)?"audio/mp4":/\.mp3$/i.test(name)?"audio/mpeg":"audio/ogg"));
 const data=b64(await blob.arrayBuffer());
 clearMedia();newMedia={kind:isImg?"image":"audio",mime,name,size:blob.size,data,url:URL.createObjectURL(blob),blob};showMedia();
 const n=$("fillNote");if(n)n.innerHTML="";
}

function parseJSON(text){try{return JSON.parse(text)}catch(e){}const m=String(text).match(/\{[\s\S]*\}/);if(m){try{return JSON.parse(m[0])}catch(e){}}return null}
async function smartParse(txt,media){
 const basic=()=>media&&!txt.trim()?{name:"",phone:"",city:"",address:"",productId:"",productAsked:"",qty:1,note:""}:ruleParse(txt);
 // 0) Talabia server (online mode)
 if(CLOUD&&session&&CONFIG.ai){
  const t=await token().catch(()=>null);
  if(!t)return{data:basic(),by:"rules",why:navigator.onLine===false?"No internet, used the basic reader.":"Please log out and log in again to use AI."};
  try{
   const catalog=SH_().products.map(p=>({id:p.id,name:p.name,price:p.price,words:p.kw}));
   const r=await fetch(CONFIG.url+"/functions/v1/smart-fill",{method:"POST",headers:{apikey:CONFIG.anon,Authorization:"Bearer "+t,"content-type":"application/json"},body:JSON.stringify({message:txt,catalog,media:media?{mime:media.mime,data:media.data}:undefined})});
   const j=await r.json().catch(()=>({}));
   if(r.ok){if(profile){profile.ai_month=new Date().toISOString().slice(0,7);profile.ai_used=j.used||profile.ai_used}
    const d=cleanAI(j.result,txt);if(d)return{data:d,by:"ai",left:j.limit?Math.max(0,j.limit-j.used):null}}
   if(r.status===402)return{data:basic(),by:"rules",why:`You used your ${j.limit||20} free AI reads this month. Go Pro in My account for unlimited AI.`};
   if(media&&(j.error==="media_type"||j.error==="media_too_big"))return{data:basic(),by:"rules",why:j.error==="media_type"?"This kind of file can't be read. Use a picture or a WhatsApp voice note.":"This file is too big (10 MB max)."};
   const code=j.error||j.code||j.message||"";
   return{data:basic(),by:"rules",why:(r.status===404?"Smart fill is not installed on the server yet (smart-fill function not found).":r.status===401?"The server refused the request (error 401). In Supabase, turn off \"Verify JWT\" for smart-fill.":code==="no_key"?"The AI key is missing on the server (GEMINI_API_KEY).":"AI is not available right now")+` [${r.status}${code?" "+String(code).slice(0,40):""}]`+(media?" Type the order by hand or try again.":" Used the basic reader.")};
  }catch(e){return{data:basic(),by:"rules",why:navigator.onLine===false?"No internet"+(media?". Try again when you're online.":", used the basic reader."):"Couldn't reach Smart fill on the server. Check that the smart-fill function is deployed in Supabase (and \"Verify JWT\" is off). Used the basic reader."}}
 }
 // 1) Claude app
 if(media&&media.kind==="audio")return{data:basic(),by:"rules",why:"Voice notes are read in the installed app (online). Here you can try a screenshot or pasted text."};
 if(!aiBlocked){const sample=await getSample();
  if(sample){try{const r=await sample.json(aiPrompt(txt,media?"image":""),media?{modelTier:"quick",images:[media.blob]}:{modelTier:"quick"});const d=cleanAI(r,txt);if(d)return{data:d,by:"ai"}}
   catch(e){if(e&&["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code))aiBlocked=true}}}
 // 2) Claude API key saved on this phone
 if(media)return{data:basic(),by:"rules",why:"Reading screenshots needs AI. Connect your account to the internet and try again."};
 const key=getKey();
 if(key){try{
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
   body:JSON.stringify({model:AI_MODEL,max_tokens:400,messages:[{role:"user",content:aiPrompt(txt)}]})});
  if(res.ok){const j=await res.json();const text=(j.content||[]).map(c=>c.text||"").join("");const d=cleanAI(parseJSON(text),txt);if(d)return{data:d,by:"ai"}}
  else return{data:ruleParse(txt),by:"rules",why:res.status===401?"Your AI key was refused. Check it in My account.":"AI is busy right now, used the basic reader."};
 }catch(e){return{data:ruleParse(txt),by:"rules",why:"No internet, used the basic reader."}}}
 // 3) basic rules
 return{data:ruleParse(txt),by:"rules"};
}

function dayStart(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function salesByDay(orders,n){const d0=dayStart(Date.now()),out=Array(n).fill(0),cnt=Array(n).fill(0);
 orders.forEach(o=>{if(o.status==="refused")return;const k=Math.round((d0-dayStart(o.t))/D);if(k>=0&&k<n){out[n-1-k]+=+o.price||0;cnt[n-1-k]++}});return{out,cnt}}
function moneyHero(orders){const {out,cnt}=salesByDay(orders,7),t=out[6],y=out[5],n=cnt[6],mx=Math.max(...out,1);
 const loc=LANG==="ar"?"ar-MA":LANG==="en"?"en-GB":"fr-FR";
 const wd=i=>new Date(Date.now()-(6-i)*D).toLocaleDateString(loc,{weekday:"narrow"});
 let trend="";if(y>0&&t>0){const q=Math.round((t-y)/y*100);trend=q>=0?`▲ ${q}% vs yesterday`:`▼ ${-q}% vs yesterday`}else if(t>0)trend="▲ Nice start";
 return `<div class="hero money"><div class="mtop"><span>${esc(shop())} <span class="wave">👋</span></span><span>Sales today</span></div>
  <div class="mbig">${dh(t)}</div>
  <div class="mrow"><span>${n===0?"No orders yet today":n===1?"1 order today":n+" orders today"}</span>${trend?`<span class="trend">${trend}</span>`:""}</div>
  <div class="week" aria-hidden="true">${out.map((v,i)=>`<i class="${i===6?"now":""}" style="height:${v>0?Math.max(14,Math.round(v/mx*100)):8}%"></i>`).join("")}</div>

let prodImg; // undefined = unchanged, "" = removed, data URL = new photo (not saved yet)
const safeImg=u=>/^(https:\/\/|data:image\/(jpeg|png|webp);base64,)/.test(String(u||""))?u:"";
function shrinkPhoto(file,max){return new Promise((ok,ko)=>{const url=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL("image/jpeg",.8))};
 im.onerror=()=>{URL.revokeObjectURL(url);ko()};im.src=url})}
async function uploadProductImg(dataUrl,pid){
 if(!CLOUD)return dataUrl;
 const t=await token();if(!t)throw{code:"auth"};
 const blob=await (await fetch(dataUrl)).blob(),path=`${shopUid||session.uid}/${pid}-${Date.now()}.jpg`;
 const r=await fetch(`${CONFIG.url}/storage/v1/object/products/${path}`,{method:"POST",headers:{apikey:CONFIG.anon,Authorization:"Bearer "+t,"content-type":"image/jpeg","cache-control":"31536000"},body:blob});
 if(!r.ok)throw{code:"upload",status:r.status};
 return `${CONFIG.url}/storage/v1/object/public/products/${path}`}

let pwBusy=false;
async function changePw(){
 if(pwBusy)return;
 const o=$("pwOld").value,n=$("pwNew").value,n2=$("pwNew2").value;
 if(!o){toast("Type your current password.");return}
 if(n.length<6){toast("Use a password of at least 6 characters.");return}
 if(n!==n2){toast("The two passwords don't match.");return}
 if(n===o){toast("The new password is the same as the current one.");return}
 const clear=()=>["pwOld","pwNew","pwNew2"].forEach(id=>{if($(id))$(id).value=""});
 if(!CLOUD){const a=S.accounts.find(x=>x.phone===S.user);if(!a||a.pass!==o){toast("Your current password is wrong.");return}a.pass=n;save();clear();toast("Password changed");return}
 pwBusy=true;const b=$("changePw");b.classList.add("busy");b.textContent="Saving…";
 const done=m=>{pwBusy=false;const x=$("changePw");if(x){x.classList.remove("busy");x.textContent="Change my password"}toast(m)};
 try{
  const chk=await authCall("token?grant_type=password",{email:emailOf(S.user),password:o});
  if(!chk.ok)return done(chk.status===429?"Too many tries. Wait a minute and try again.":"Your current password is wrong.");
  takeSession(chk.j);
  const res=await fetch(CONFIG.url+"/auth/v1/user",{method:"PUT",headers:{apikey:CONFIG.anon,Authorization:"Bearer "+session.access,"content-type":"application/json"},body:JSON.stringify({password:n})});
  if(!res.ok)return done("Couldn't save. Check your internet and try again.");
  clear();done("Password changed");
 }catch(e){done("No internet connection. Check it and try again.")}}

async function submitPay(){

 if(!payReceipt){toast("Add a photo of your receipt first.");return}

 payBusy=true;render();
 try{
  if(!CLOUD){PV.reqs.unshift({id:Date.now(),mine:true,phone:S.user,shop:shop(),months:payMonths,amount:planTotal(payMonths),method:payMethod,reference:ref,receipt_url:payReceipt?payReceipt.url:"",status:"pending",admin_note:"",created_at:new Date().toISOString()});payReq=PV.reqs[0]}
  else{
   const t=await token();if(!t)throw{msg:"Please log in again."};
   let path="";
   if(payReceipt){path=`${session.uid}/${Date.now()}.jpg`;
    const up=await fetch(CONFIG.url+"/storage/v1/object/receipts/"+path,{method:"POST",headers:{apikey:CONFIG.anon,Authorization:"Bearer "+t,"content-type":payReceipt.blob.type||"image/jpeg"},body:payReceipt.blob});
    if(!up.ok)throw{msg:"The photo couldn't be uploaded. Try again."}}
   const rows=await api("/rest/v1/pay_requests",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify({phone:S.user,shop:shop(),months:payMonths,amount:planTotal(payMonths),method:payMethod,reference:ref,receipt_path:path})});
   payReq=rows&&rows[0]||null}
  payReceipt=null;payOpen=false;toast("Thanks! We'll confirm your payment within 12 hours.");
 }catch(e){toast(e&&e.msg?e.msg:navigator.onLine===false?"No internet. Try again when you're online.":"Couldn't send. You may already have a payment waiting.")}
 payBusy=false;render()}

const backBtn=(to,label)=>`<button type="button" class="back" data-tab="${to||"today"}">← ${label||"Home"}</button>`;
const fmtDate=t=>{const d=new Date(t);return d.toLocaleDateString("fr-MA",{day:"2-digit",month:"2-digit"})};
const isSold=o=>o.status==="delivered"||o.status==="paid";

/* ---------- Reports ---------- */
let repPeriod="month";
const PERIODS=[["7d","7 days"],["month","This month"],["last","Last month"],["all","All time"]];
function periodRange(k){const n=new Date();const y=n.getFullYear(),m=n.getMonth();
 if(k==="7d"){const a=new Date(n);a.setHours(0,0,0,0);a.setDate(a.getDate()-6);return[a.getTime(),Infinity]}
 if(k==="month")return[new Date(y,m,1).getTime(),Infinity];
 if(k==="last")return[new Date(y,m-1,1).getTime(),new Date(y,m,1).getTime()];
 return[0,Infinity]}
function vReports(){
 if(!proActive())return proTeaser("reports");
 const [a,b]=periodRange(repPeriod),all=SH_().orders.filter(o=>o.t>=a&&o.t<b);
 const sold=all.filter(isSold),refused=all.filter(o=>o.status==="refused");
 const revenue=sold.reduce((x,o)=>x+o.price,0),fees=sold.reduce((x,o)=>x+orderFee(o),0);
 let missingCost=false;const costs=sold.reduce((x,o)=>x+itemsOf(o).reduce((y,i)=>{const p=prod(i.productId);if(!p||p.cost==null){missingCost=true;return y}return y+p.cost*i.qty},0),0);
 const lost=all.reduce((x,o)=>x+lostOf(o),0),profit=revenue-fees-costs-lost;
 const closed=sold.length+refused.length,rate=closed?Math.round(100*refused.length/closed):0;
 // best products
 const bp={};sold.forEach(o=>itemsOf(o).forEach(i=>{const k=i.productId||i.name;bp[k]=bp[k]||{name:i.name,qty:0,rev:0};bp[k].qty+=+i.qty||0;bp[k].rev+=+i.price||0}));
 const best=Object.values(bp).sort((x,y)=>y.rev-x.rev).slice(0,5);
 // refusals by city
 const bc={};[...sold,...refused].forEach(o=>{const c=o.city||"—";bc[c]=bc[c]||{city:c,n:0,r:0};bc[c].n++;if(o.status==="refused")bc[c].r++});
 const cities=Object.values(bc).filter(c=>c.r>0).sort((x,y)=>y.r/y.n-x.r/x.n||y.r-x.r).slice(0,6);
 return backBtn()+`<div><h1>Reports</h1><p class="sub">Delivered and paid orders count as sales.</p></div>
 <div class="chips">${PERIODS.map(([k,l])=>`<button type="button" class="chip" data-period="${k}" aria-pressed="${repPeriod===k}">${l}</button>`).join("")}</div>
 <div class="kpis"><div class="kpi big"><span>Profit</span><strong>${dh(profit)}</strong></div>
  <div class="kpi"><span>Sales</span><strong>${dh(revenue)}</strong></div>
  <div class="kpi"><span>Orders</span><strong>${all.length}</strong></div>
  <div class="kpi"><span>Delivered</span><strong>${sold.length}</strong></div>
  <div class="kpi ${rate>=25?"warn":""}"><span>Refusal rate</span><strong>${rate}%</strong></div></div>
 <div class="card"><h2>How profit is counted</h2>
  <div class="calc"><span>Sales</span><b>${dh(revenue)}</b><span>− Delivery fees</span><b>${dh(fees)}</b><span>− Product costs</span><b>${dh(costs)}</b><span class="tot">Profit</span><b class="tot">${dh(profit)}</b></div>
  ${missingCost?`<p class="hint" style="margin:0">Some products have no cost price, so profit looks higher than it is. <button type="button" class="btn link" data-tab="products" style="display:inline;padding:0">Add cost prices</button></p>`:""}</div>
 <div class="card"><h2>Orders per day</h2>${dayChart(repPeriod)}<p class="hint" id="chartTip" style="margin:0">Tap a bar to see the day.</p></div>
 <div class="card"><h2>Best products</h2>${best.length?`<div class="rtable">${best.map((x,i)=>`<span class="rk">${i+1}</span><span>${esc(x.name)}</span><span class="num">${x.qty} sold</span><b class="num">${dh(x.rev)}</b>`).join("")}</div>`:`<p class="hint" style="margin:0">No delivered orders in this period yet.</p>`}</div>
 <div class="card"><h2>Refusals by city</h2>${cities.length?`<div class="rtable c4">${cities.map(c=>`<span>${esc(c.city)}</span><span class="num">${c.r} of ${c.n}</span><span class="bar"><i style="width:${Math.round(100*c.r/c.n)}%"></i></span><b class="num">${Math.round(100*c.r/c.n)}%</b>`).join("")}</div><p class="hint" style="margin:0">Ask for a deposit or confirm twice for cities with many refusals.</p>`:`<p class="hint" style="margin:0">No refused orders in this period. 👏</p>`}</div>`}
function dayChart(k){
 const days=k==="7d"?7:k==="last"?new Date(new Date().getFullYear(),new Date().getMonth(),0).getDate():k==="month"?new Date().getDate():30;
 let start;if(k==="last"){const n=new Date();start=new Date(n.getFullYear(),n.getMonth()-1,1)}else{start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-(days-1))}
 const counts=[];for(let i=0;i<days;i++){const d0=new Date(start);d0.setDate(d0.getDate()+i);const t0=d0.getTime(),t1=t0+D;counts.push({t:t0,n:SH_().orders.filter(o=>o.t>=t0&&o.t<t1).length})}
 const max=Math.max(1,...counts.map(c=>c.n)),W=340,H=130,top=14,bot=20,ch=H-top-bot,gap=2,bw=(W-gap*(days-1))/days;
 const bars=counts.map((c,i)=>{const x=i*(bw+gap),h=c.n?Math.max(3,ch*c.n/max):0,y=top+ch-h,r=Math.min(4,bw/2,h);
  const label=`${fmtDate(c.t)}: ${c.n} order${c.n===1?"":"s"}`;
  return `<g class="bh" data-tip="${label}"><rect x="${x}" y="${top}" width="${bw}" height="${ch}" fill="transparent"/>${h?`<path d="M${x},${top+ch}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${top+ch}Z" class="b"/>`:""}<title>${label}</title></g>`}).join("");
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Orders per day">
  <line x1="0" y1="${top}" x2="${W}" y2="${top}" class="grid"/><line x1="0" y1="${top+ch/2}" x2="${W}" y2="${top+ch/2}" class="grid"/><line x1="0" y1="${top+ch}" x2="${W}" y2="${top+ch}" class="axis"/>
  <text x="0" y="${top-4}" class="tk">${max}</text>${bars}
  <text x="0" y="${H-4}" class="tk">${fmtDate(counts[0].t)}</text><text x="${W}" y="${H-4}" class="tk" text-anchor="end">${fmtDate(counts[days-1].t)}</text></svg></div>`}

const META_KEYS=["carriers","templates","tplDefault","blocked","teamPreview"];
function mergeShop(local,remote){
 if(!remote||!Array.isArray(remote.products))return local;if(!local)return remote;
 const del=Object.assign({},remote.del||{},local.del||{});
 const list=(a,b)=>{const m=new Map();(b||[]).forEach(x=>m.set(String(x.id),x));(a||[]).forEach(x=>{const r=m.get(String(x.id));if(!r||(x.u||0)>=(r.u||0))m.set(String(x.id),x)});return[...m.values()].filter(x=>!(del[x.id]&&del[x.id]>=(x.u||0)))};
 const out=Object.assign({},remote,local,{products:list(local.products,remote.products),orders:list(local.orders,remote.orders),del,next:Math.max(local.next||1,remote.next||1)});
 if((remote.metaU||0)>(local.metaU||0)){META_KEYS.forEach(k=>{if(remote[k]!==undefined)out[k]=remote[k]});out.metaU=remote.metaU}
 return out}

function countUp(root){

 root.querySelectorAll(".kpi strong,.total strong,.mbig").forEach(el=>{
  const txt=el.textContent,num=parseFloat(txt.replace(/[^\d.,-]/g,"").replace(/[\s\u202f\u00a0]/g,"").replace(",","."));
  if(!(num>0))return;const suf=/DH$/.test(txt)?"dh":/%$/.test(txt)?"%":"";
  const t0=performance.now(),dur=700;
  const step=t=>{const k=Math.min(1,(t-t0)/dur),v=Math.round(num*(1-Math.pow(1-k,3)));
   el.textContent=suf==="dh"?dh(v):suf==="%"?v+"%":v;if(k<1)requestAnimationFrame(step);else el.textContent=txt};
  requestAnimationFrame(step)})}

 if(el.id==="addPhoto"||el.id==="addVoice"){pickFile("media");return}
 if(el.id==="mediaX"){clearMedia();return}
 if(el.id==="saveOrder"){const g=id=>$(id).value.trim();
   const its=formItems.map(it=>({p:prod(it.id),q:Math.max(1,it.qty)})).filter(x=>x.p);
   if(!g("fName")||g("fPhone").replace(/\D/g,"").length<10||!its.length){toast("Add a name, a 10-digit phone and a product");return}
   const items=its.map(x=>({productId:x.p.id,name:x.p.name,qty:x.q,price:x.p.price*x.q})),p=its[0].p,qty=items.reduce((a,i)=>a+i.qty,0),sum=items.reduce((a,i)=>a+i.price,0);
   if(!proActive()&&ordersThisMonth()>=FREE_ORDERS){go({tab:"add"});return}
   const o={id:Date.now(),no:SH_().next++,u:Date.now(),name:g("fName"),phone:g("fPhone").replace(/\D/g,""),city:g("fCity")||"—",address:g("fAddress"),productId:p.id,qty,product:items.length>1?itemsLabel(items):p.name,items,note:g("fNote"),price:+g("fPrice")||sum,ship:feeOf(g("fCarrier")),status:"new",carrier:g("fCarrier"),t:Date.now()};
   if(newSrc!=="other")o.src=newSrc;
   SH_().orders.push(o);takeStock(o);save();clearMedia();formItems=[];pickOpen=false;
   toast(items.length>1?"Order saved":`Order saved · ${p.name}: ${p.stock} left`);go({tab:"detail",id:o.id});return}
});
/* Android back button: go back inside the app; return false to leave the app */
window.talabiaBack=function(){
 if(!S.user){if(authMode==="signup"&&S.accounts.length){authMode="login";render();return true}return false}
 if(editProd){editProd=null;render();return true}
 if(confirmDelete||confirmAcct){confirmDelete=false;confirmAcct=false;render();return true}
 if(route.tab==="detail"){go({tab:"orders"});return true}
 if(route.tab==="customer"){go({tab:"customers"});return true}
 if(route.tab==="admin"){go({tab:"account"});return true}
 if(route.tab!=="today"){go({tab:"today"});return true}
 return false};

if(CLOUD){
 if(S.user&&!session){S.user=null}
 if(S.user&&session){refreshCloud()}
 document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.user&&session&&!(picking&&Date.now()<picking.until))refreshCloud()});
}
render();
})();
